.f{position:relative; display:inline-block;}
  .f.apple{width:30px;height:30px;border-radius:50%;background:var(--red);}
  .f.apple::before{content:'';position:absolute;left:13px;top:-8px;width:4px;height:9px;background:#82593A;border-radius:2px;}
  .f.apple::after{content:'';position:absolute;left:16px;top:-8px;width:12px;height:7px;background:#4D9E54;border-radius:50% 50% 50% 0;}
  .f.banana{width:40px;height:24px;border-radius:50%;background:#FBD147;
            box-shadow:inset 0 4px 0 rgba(255,255,255,.45);}
  .f.straw{width:26px;height:28px;border-radius:50% 50% 55% 55%;background:#E63D59;}
  .f.straw::after{content:'';position:absolute;left:7px;top:-6px;width:12px;height:8px;background:#4D9E54;border-radius:50% 50% 0 0;}
  .f.orange{width:32px;height:32px;border-radius:50%;background:#F79A29;}
  .f.orange::after{content:'';position:absolute;left:13px;top:-5px;width:6px;height:7px;background:#4D9E54;border-radius:2px;}
.f{position:relative; display:inline-block;}
  .f.fish{width:34px;height:22px;border-radius:50% 40% 40% 50%; background:var(--fish);}
  .f.fish::before{content:'';position:absolute;right:-9px;top:3px;width:0;height:0;
    border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:11px solid var(--fish);}
  .f.fish::after{content:'';position:absolute;left:7px;top:6px;width:5px;height:5px;border-radius:50%;background:#16303C;}
  .f.crab{width:32px;height:24px;border-radius:14px 14px 10px 10px; background:var(--crab);}
  .f.crab::before{content:'';position:absolute;left:4px;top:-6px;width:6px;height:8px;background:var(--crab);border-radius:3px;
    box-shadow:16px 0 0 var(--crab);}
  .f.crab::after{content:'';position:absolute;left:8px;top:8px;width:5px;height:5px;border-radius:50%;background:#fff;
    box-shadow:10px 0 0 #fff;}
  .f.shell{width:30px;height:28px;background:var(--shellc);
    border-radius:50% 50% 46% 46%/62% 62% 38% 38%;}
  .f.shell::after{content:'';position:absolute;left:13px;top:5px;width:4px;height:18px;background:rgba(255,255,255,.7);border-radius:2px;
    box-shadow:-7px 2px 0 rgba(255,255,255,.5), 7px 2px 0 rgba(255,255,255,.5);}
  .f.octo{width:32px;height:26px;border-radius:50% 50% 30% 30%; background:var(--octo);}
  .f.octo::before{content:'';position:absolute;bottom:-5px;left:3px;width:6px;height:8px;background:var(--octo);border-radius:0 0 4px 4px;
    box-shadow:8px 0 0 var(--octo), 16px 0 0 var(--octo);}
  .f.octo::after{content:'';position:absolute;left:7px;top:8px;width:5px;height:5px;border-radius:50%;background:#fff;
    box-shadow:10px 0 0 #fff;}
.f{position:relative; display:inline-block;}
  .f.ball{width:30px;height:30px;border-radius:50%;background:var(--ball);
    box-shadow:inset -5px -5px 0 rgba(0,0,0,.08);}
  .f.ball::after{content:'';position:absolute;left:0;top:12px;width:30px;height:5px;
    background:rgba(255,255,255,.75);border-radius:3px;}
  .f.teddy{width:30px;height:28px;border-radius:50% 50% 45% 45%;background:var(--teddy);}
  .f.teddy::before{content:'';position:absolute;left:-2px;top:-5px;width:11px;height:11px;
    border-radius:50%;background:var(--teddy); box-shadow:22px 0 0 var(--teddy);}
  .f.teddy::after{content:'';position:absolute;left:8px;top:11px;width:4px;height:4px;
    border-radius:50%;background:#3A2A2A; box-shadow:9px 0 0 #3A2A2A;}
  .f.balloon{width:26px;height:32px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:var(--balloon);}
  .f.balloon::after{content:'';position:absolute;left:12px;top:30px;width:2px;height:10px;background:#7C6461;}
  .f.car{width:36px;height:18px;border-radius:6px 10px 5px 5px;background:var(--carc);}
  .f.car::before{content:'';position:absolute;left:6px;top:-7px;width:18px;height:9px;
    border-radius:5px 5px 0 0;background:#F08A78;}
  .f.car::after{content:'';position:absolute;left:4px;bottom:-5px;width:9px;height:9px;
    border-radius:50%;background:#3A2A2A; box-shadow:18px 0 0 #3A2A2A;}

  /* ---------- HUD ---------- */
  .topbar{position:absolute; left:20px; top:9px; right:20px; height:52px;
    background:rgba(160,232,246,.95); border-radius:20px; display:flex; align-items:center;
    justify-content:space-between; padding:0 12px; z-index:8;
    box-shadow:0 3px 10px rgba(0,0,0,.18);}
  .hud{display:flex; align-items:center; gap:8px;}
  .pill{background:#fff; border-radius:14px; height:42px; min-width:42px; display:flex;
    align-items:center; justify-content:center; font-weight:800; color:var(--ink);
    padding:0 14px; font-size:18px; border:none; cursor:pointer; transition:transform .1s;
    box-shadow:0 2px 4px rgba(0,0,0,.12);}
  .pill:active{transform:scale(.92);}
  .icon-btn{width:42px; padding:0; font-size:19px;}
  .title{font-size:25px; font-weight:900; color:var(--ink); letter-spacing:-.3px;
    text-shadow:0 1px 0 rgba(255,255,255,.6);}
  .stars{color:#C4870F;}

  /* ---------- prompt ---------- */
  .prompt{position:absolute; left:50%; transform:translateX(-50%); top:66px;
    background:rgba(255,255,255,.95); border-radius:16px; height:46px; padding:0 20px;
    display:flex; align-items:center; gap:12px; z-index:7;
    box-shadow:0 4px 12px rgba(0,0,0,.2); pointer-events:none;}
  .prompt .q{font-size:24px; font-weight:900; color:var(--ink); white-space:nowrap;}
  .speaker{width:34px; height:34px; border-radius:50%; border:none; background:var(--amber);
    color:#fff; font-size:18px; cursor:pointer; box-shadow:0 3px 0 var(--amber-dark);
    pointer-events:auto;}
  .speaker:active{transform:translateY(2px); box-shadow:0 1px 0 var(--amber-dark);}

  /* ---------- progress dots ---------- */
  .dots{position:absolute; left:0; right:0; top:120px; display:flex; justify-content:center;
    gap:10px; z-index:7; pointer-events:none;}
  .dot{width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,.7);
    border:3px solid rgba(0,0,0,.18); transition:transform .2s, background .2s;}
  .dot.on{background:var(--accent); border-color:var(--accent-deep); transform:scale(1.18);}

  /* ---------- play area ---------- */
  #lines{position:absolute; inset:0; z-index:3; pointer-events:none;}
  .col{position:absolute; top:140px; z-index:4;}
  #numCol{left:300px;}
  #basketCol{left:690px;}

  .num{width:130px; height:86px; margin-bottom:7px; background:var(--card);
    border:5px solid var(--accent-deep); border-radius:22px; display:flex;
    align-items:center; justify-content:center; font-size:48px; font-weight:900;
    color:var(--accent-deep); box-shadow:0 5px 14px rgba(0,0,0,.3); cursor:pointer;
    transition:transform .14s, box-shadow .14s; touch-action:none; user-select:none;}
  .num:hover{transform:scale(1.05);}
  .num.sel{border-color:var(--amber); box-shadow:0 0 0 6px rgba(245,179,60,.55),0 6px 16px rgba(0,0,0,.3);
    transform:scale(1.07);}
  .num.done{opacity:.45; cursor:default;} .num.done:hover{transform:none;}
  .num.hintpulse{animation:pulse .7s ease-in-out 3;}

  .basket{width:190px; height:86px; margin-bottom:7px; background:rgba(255,255,255,.95);
    border:5px solid rgba(0,0,0,.16); border-radius:22px; position:relative;
    box-shadow:0 5px 14px rgba(0,0,0,.3); cursor:pointer;
    transition:transform .14s, box-shadow .14s; touch-action:none; user-select:none; overflow:hidden;}
  .basket:hover{transform:scale(1.04);}
  .basket.done{opacity:.45; cursor:default;} .basket.done:hover{transform:none;}
  .basket.hintpulse{animation:pulse .7s ease-in-out 3;}
  .basket.shake{animation:shake .4s;}
  .fruits{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    gap:9px; padding:8px 12px; pointer-events:none;}

  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}
    40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

  /* ---------- character guide ---------- */
  .guide{position:absolute; left:12px; bottom:6px; z-index:6; width:210px;
    text-align:center; pointer-events:none; animation:bob 3.2s ease-in-out infinite;}
  .guide .bubble{background:rgba(255,255,255,.96); border-radius:16px; padding:7px 12px;
    font-weight:800; color:var(--ink); font-size:14px; box-shadow:0 4px 10px rgba(0,0,0,.22);
    margin-bottom:4px; display:inline-block; max-width:200px;}
  .guide .face{font-size:44px; line-height:1;}

  /* ---------- controls ---------- */
  .controls{position:absolute; left:50%; transform:translateX(-50%); bottom:12px;
    display:flex; gap:16px; z-index:7; pointer-events:none;}
  .btn{border:none; border-radius:18px; color:#fff; font-weight:800; font-size:20px;
    padding:0 24px; height:48px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.28);
    transition:transform .1s, box-shadow .1s; display:flex; align-items:center; gap:8px;
    pointer-events:auto;}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.28);}
  .btn.green{background:var(--accent);} .btn.amber{background:var(--amber);}
  .btn.grey{background:#7C7C7C;}

  /* ---------- feedback ---------- */
  .feedback{position:absolute; left:50%; transform:translateX(-50%) translateY(12px);
    bottom:70px; min-width:360px; padding:9px 22px; border-radius:18px; text-align:center;
    z-index:9; opacity:0; pointer-events:none; transition:opacity .22s, transform .22s;
    box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .feedback.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .feedback .big{font-size:23px; font-weight:900; line-height:1.2;}
  .feedback .small{font-size:16px; font-weight:600; color:var(--muted); margin-top:1px;}
  .feedback.good{background:#DFF6E1;} .feedback.good .big{color:#2F7A3A;}
  .feedback.bad{background:#FFE3D8;} .feedback.bad .big{color:#C0431F;}
  .feedback.tip{background:#FFF1CE;} .feedback.tip .big{color:#8F6206;}

  /* ---------- overlays ---------- */
  .overlay{position:absolute; inset:0; z-index:20; display:flex; align-items:center;
    justify-content:center; background:rgba(18,32,26,.5); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .28s;}
  .overlay.show{opacity:1; pointer-events:auto;}
  .panel{background:rgba(255,255,255,.97); border-radius:26px; padding:28px 40px;
    text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.3);
    transform:scale(.9); transition:transform .28s;}
  .overlay.show .panel{transform:scale(1);}
  .panel h1{font-size:40px; font-weight:900; color:var(--accent-deep); margin-bottom:10px;}
  .panel h2{font-size:32px; font-weight:900; color:var(--accent-deep); margin-bottom:8px;}
  .panel p{font-size:20px; color:var(--muted); font-weight:600; margin-bottom:20px; line-height:1.45;}
  .panel .row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .bigstars{font-size:46px; letter-spacing:7px; margin-bottom:6px;}
  #confetti{position:absolute; inset:0; z-index:19; pointer-events:none;}
</style>
</head>
<body>
<div id="stage">

  <div class="topbar">
    <div class="hud">
      <button class="pill icon-btn" id="pauseBtn" title="Pause">&#10074;&#10074;</button>
      <button class="pill icon-btn" id="muteBtn" title="Sound on or off">&#128266;</button>
    </div>
    <div class="title">Under the Sea</div>
    <div class="hud"><div class="pill stars"><span id="starTxt">&#9733; 0</span></div></div>
  </div>

  <div class="prompt">
    <span class="q" id="promptText">Count the animals!</span>
    <button class="speaker" id="speakerBtn" title="Say it again">&#128266;</button>
  </div>

  <div class="dots" id="dots"></div>

  <svg id="lines"></svg>
  <div class="col" id="numCol"></div>
  <div class="col" id="basketCol"></div>

  <div class="guide">
    <div class="bubble" id="guideBubble">Let's count!</div>
    <div class="face">🐢</div>
  </div>

  <div class="feedback" id="feedback">
    <div class="big" id="fbBig"></div><div class="small" id="fbSmall"></div>
  </div>

  <div class="controls">
    <button class="btn amber" id="hintBtn">&#10068; Hint</button>
    <button class="btn green" id="resetBtn">&#8635; Start over</button>
  </div>

  <canvas id="confetti"></canvas>

  <div class="overlay show" id="startOv"><div class="panel">
    <h1>Under the Sea</h1>
    <p>Count the animals!<br>Draw a line from each number to the group with that many.</p>
    <div class="row"><button class="btn green" id="playBtn" style="font-size:24px;height:60px;padding:0 36px;">&#9654; &nbsp;Play</button></div>
  </div></div>

  <div class="overlay" id="pauseOv"><div class="panel">
    <h2>Paused</h2>
    <div class="row">
      <button class="btn green" id="resumeBtn">&#9654; Resume</button>
      <button class="btn amber" id="pResetBtn">&#8635; Start over</button>
      <button class="btn grey" id="pHomeBtn">&#8962; Home</button>
    </div>
  </div></div>

  <div class="overlay" id="doneOv"><div class="panel">
    <div class="bigstars">&#11088;&#11088;&#11088;</div>
    <h2>Level Complete!</h2>
    <p>You counted all the animals.<br>Great counting!</p>
    <div class="row">
      <button class="btn amber" id="againBtn">&#8635; Again</button>
      <button class="btn grey" id="backBtn">&#8962; Home</button>
    </div>
  </div></div>
</div>

<script>
(function(){
  const GROUPS=[{"kind":"fish","count":3,"name":"fish"},{"kind":"crab","count":1,"name":"crabs"},{"kind":"shell","count":4,"name":"shells"},{"kind":"octo","count":2,"name":"octopuses"}];
  const NUMS=[1,2,3,4];
  const PROMPT="Count the animals!";
  const NOUN="animals";
  const LINE="#2AA3B8";
  const CONFCOLS=['#F7902B','#E0533D','#F0A9C4','#37B6C4','#FBD147','#B87BD1'];

  const $=id=>document.getElementById(id);
  const stage=$('stage'), numCol=$('numCol'), bCol=$('basketCol'), svg=$('lines');
  const fb=$('feedback'), fbBig=$('fbBig'), fbSmall=$('fbSmall'), starTxt=$('starTxt');
  const dotsWrap=$('dots'), guideBubble=$('guideBubble');
  const startOv=$('startOv'), pauseOv=$('pauseOv'), doneOv=$('doneOv');
  const cvs=$('confetti'), ctx=cvs.getContext('2d');
  let selected=null, solved={}, stars=0, dragLine=null, paused=false, muted=false;

  /* ---------- audio: everything routes through a master gain ---------- */
  let AC=null, MASTER=null;
  function ac(){
    if(!AC){
      try{
        AC=new (window.AudioContext||window.webkitAudioContext)();
        MASTER=AC.createGain(); MASTER.gain.value=1; MASTER.connect(AC.destination);
      }catch(e){ AC=null; }
    }
    if(AC && AC.state==='suspended'){ AC.resume(); }
    return AC;
  }
  function tone(freq,dur,type,vol,when){
    if(muted) return; const a=ac(); if(!a||!MASTER) return;
    const t0=a.currentTime+(when||0);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    o.connect(g); g.connect(MASTER);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||0.2,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  const sCorrect=()=>{ tone(660,0.14,'triangle',0.26,0); tone(880,0.22,'triangle',0.26,0.12); };
  const sWrong  =()=>{ tone(210,0.26,'sawtooth',0.15,0); };
  const sClick  =()=>{ tone(430,0.06,'square',0.11,0); };
  const sPick   =()=>{ tone(550,0.07,'sine',0.13,0); };
  const sWin    =()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.22,i*0.12)); };

  /* background music */
  let musicTimer=null, mi=0;
  const NOTES=[392,523,659,523,440,587,494,392];
  function musicStart(){
    if(muted||musicTimer) return;
    musicTimer=setInterval(()=>{
      if(paused||muted) return;
      tone(NOTES[mi%NOTES.length],0.4,'sine',0.05,0);
      tone(NOTES[mi%NOTES.length]/2,0.4,'triangle',0.035,0);
      mi++;
    },430);
  }
  function musicStop(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

  /* mute: silences the master gain instantly, so already-scheduled notes stop too */
  function setMuted(m){
    muted=m;
    $('muteBtn').innerHTML = m ? '&#128263;' : '&#128266;';
    if(AC && MASTER){
      MASTER.gain.cancelScheduledValues(AC.currentTime);
      MASTER.gain.setValueAtTime(m?0:1, AC.currentTime);
    }
    if(m) musicStop(); else if(!startOv.classList.contains('show')) musicStart();
  }

  /* ---------- scale to fit ---------- */
  function fit(){
    const s=Math.min((window.innerWidth-20)/1194,(window.innerHeight-20)/600,1);
    stage.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit); fit();

  /* ---------- build ---------- */
  function fruitHTML(g){ let h='<div class="fruits">';
    for(let i=0;i<g.count;i++) h+='<span class="f '+g.kind+'"></span>'; return h+'</div>'; }
  function build(){
    numCol.innerHTML=''; bCol.innerHTML=''; dotsWrap.innerHTML='';
    NUMS.forEach(n=>{
      const d=document.createElement('div');
      d.className='num'; d.textContent=n; d.dataset.n=n;
      d.addEventListener('pointerdown',e=>pickNum(e,d));
      numCol.appendChild(d);
    });
    GROUPS.forEach((g,i)=>{
      const d=document.createElement('div');
      d.className='basket'; d.dataset.i=i; d.innerHTML=fruitHTML(g);
      d.addEventListener('pointerdown',e=>{ e.preventDefault(); dropBasket(d); });
      bCol.appendChild(d);
    });
    for(let i=0;i<4;i++){ const dot=document.createElement('div'); dot.className='dot'; dotsWrap.appendChild(dot); }
  }
  function center(el,right){
    const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect(), sc=s.width/1194;
    return {x:((right?r.right:r.left)-s.left)/sc, y:(r.top+r.height/2-s.top)/sc};
  }
  function drawLine(a,b,color){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',a.x); l.setAttribute('y1',a.y);
    l.setAttribute('x2',b.x); l.setAttribute('y2',b.y);
    l.setAttribute('stroke',color); l.setAttribute('stroke-width','7');
    l.setAttribute('stroke-linecap','round'); svg.appendChild(l); return l;
  }
  function redraw(){
    svg.innerHTML='';
    Object.keys(solved).forEach(n=>{
      const ne=numCol.querySelector('[data-n="'+n+'"]');
      const be=bCol.querySelector('[data-i="'+solved[n]+'"]');
      if(ne&&be) drawLine(center(ne,true),center(be,false),LINE);
    });
  }
  function updDots(){
    const done=Object.keys(solved).length;
    dotsWrap.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<done));
  }
  function guide(msg){ guideBubble.textContent=msg; }

  function pickNum(e,d){
    if(paused) return; e.preventDefault();
    if(d.classList.contains('done')) return;
    if(selected) selected.classList.remove('sel');
    selected=d; d.classList.add('sel'); hideFb(); sPick();
    guide('Now pick a group.');
    const start=center(d,true);
    if(dragLine){ dragLine.remove(); dragLine=null; }
    dragLine=drawLine(start,start,'#F5B33C');
    dragLine.setAttribute('stroke-dasharray','12 9');
    const move=ev=>{
      if(!dragLine) return;
      const s=stage.getBoundingClientRect(), sc=s.width/1194;
      dragLine.setAttribute('x2',(ev.clientX-s.left)/sc);
      dragLine.setAttribute('y2',(ev.clientY-s.top)/sc);
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      if(dragLine){ dragLine.remove(); dragLine=null; }
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  }

  function dropBasket(b){
    if(paused) return;
    if(b.classList.contains('done')) return;
    if(!selected){
      showFb('tip','Pick a number first','Tap a number, then tap a group.');
      guide('Tap a number first.');
      return;
    }
    const n=+selected.dataset.n, i=+b.dataset.i, g=GROUPS[i];
    if(g.count===n){
      solved[n]=i;
      selected.classList.remove('sel'); selected.classList.add('done');
      b.classList.add('done'); selected=null;
      stars++; starTxt.innerHTML='&#9733; '+stars;
      redraw(); updDots(); sCorrect();
      const left=4-Object.keys(solved).length;
      if(left===0){ showFb('good','&#11088; Well done!','You matched them all.'); guide('Hooray!'); setTimeout(finish,900); }
      else { showFb('good','&#127881; Yes!','That is '+n+' '+g.name+'. '+left+' to go.'); guide('Great! Keep going.'); }
    } else {
      b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),420); sWrong();
      showFb('bad','Not yet!','Count again. That group has '+g.count+'.');
      guide('Try counting again.');
      if(selected){ selected.classList.remove('sel'); selected=null; }
    }
  }

  let fbT=null;
  function showFb(kind,big,small){
    fb.className='feedback show '+kind; fbBig.innerHTML=big; fbSmall.textContent=small;
    clearTimeout(fbT); fbT=setTimeout(hideFb,2400);
  }
  function hideFb(){ fb.className='feedback'; }

  $('hintBtn').addEventListener('click',()=>{
    if(paused) return; sClick();
    const rem=NUMS.filter(n=>!(n in solved)); if(!rem.length) return;
    const n=rem[0];
    const ne=numCol.querySelector('[data-n="'+n+'"]');
    const idx=GROUPS.findIndex(g=>g.count===n);
    const be=bCol.querySelector('[data-i="'+idx+'"]');
    if(ne) ne.classList.add('hintpulse');
    if(be) be.classList.add('hintpulse');
    setTimeout(()=>{ if(ne)ne.classList.remove('hintpulse'); if(be)be.classList.remove('hintpulse'); },2200);
    showFb('tip','&#128161; Try this one','Count the '+NOUN+'. Which group has '+n+'?');
    guide('Count them slowly.');
  });
  $('speakerBtn').addEventListener('click',e=>{
    e.stopPropagation(); sClick(); guide(PROMPT);
    showFb('tip','&#128266; '+PROMPT,'Draw a line to the matching group.');
  });

  /* ---------- confetti ---------- */
  let parts=[],anim=null;
  function confetti(){
    cvs.width=1194; cvs.height=600; parts=[];
    for(let i=0;i<120;i++) parts.push({x:Math.random()*1194,y:-20-Math.random()*380,
      w:8+Math.random()*8,h:10+Math.random()*10,c:CONFCOLS[(Math.random()*CONFCOLS.length)|0],
      v:2.4+Math.random()*3.2,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.25});
    cancelAnimationFrame(anim); step();
  }
  function step(){
    ctx.clearRect(0,0,1194,600); let live=false;
    parts.forEach(p=>{
      if(!paused){ p.y+=p.v; p.r+=p.vr; }
      if(p.y<620) live=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(live) anim=requestAnimationFrame(step); else ctx.clearRect(0,0,1194,600);
  }

  /* ---------- pause ---------- */
  function setPause(p){
    paused=p; pauseOv.classList.toggle('show',p);
    if(p) musicStop(); else if(!muted) musicStart();
  }
  $('pauseBtn').addEventListener('click',()=>{ sClick(); setPause(true); });
  $('resumeBtn').addEventListener('click',()=>{ sClick(); setPause(false); });
  $('muteBtn').addEventListener('click',()=>{ setMuted(!muted); if(!muted) sClick(); });

  /* ---------- flow ---------- */
  function finish(){ musicStop(); doneOv.classList.add('show'); sWin(); confetti(); }
  function reset(){
    solved={}; stars=0; selected=null; starTxt.innerHTML='&#9733; 0';
    svg.innerHTML=''; hideFb(); guide("Let's count!");
    cancelAnimationFrame(anim); ctx.clearRect(0,0,1194,600); build();
  }
  $('playBtn').onclick =()=>{ ac(); sClick(); startOv.classList.remove('show'); setPause(false); reset(); if(!muted) musicStart(); };
  $('againBtn').onclick=()=>{ sClick(); doneOv.classList.remove('show'); reset(); if(!muted) musicStart(); };
  $('backBtn').onclick =()=>{ sClick(); doneOv.classList.remove('show'); musicStop(); reset(); startOv.classList.add('show'); };
  $('pResetBtn').onclick=()=>{ sClick(); setPause(false); reset(); };
  $('pHomeBtn').onclick =()=>{ sClick(); setPause(false); musicStop(); reset(); startOv.classList.add('show'); };
  $('resetBtn').onclick =()=>{ if(paused) return; sClick(); reset(); };

  build();
  window.addEventListener('resize',()=>setTimeout(redraw,60));
})();
</script>
</body>
</html>
